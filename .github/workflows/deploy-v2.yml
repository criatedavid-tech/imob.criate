name: Deploy V2 to Fly.io (manual)

# Só existe na branch v2 (assim como fly.toml — ver comentário nele).
# Disparo manual (botão "Run workflow" na aba Actions do GitHub), nunca
# automático em push: a v2 é publicada por decisão explícita, não a cada
# commit. Existe porque o flyctl local pode ficar bloqueado por política de
# segurança do Windows (Smart App Control) — isso builda e publica 100% nos
# runners do GitHub, sem depender de nada local.
on:
  workflow_dispatch: {}

jobs:
  deploy:
    name: Deploy imobiflow-v2
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-imobiflow-v2
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy
        run: flyctl deploy --app imobiflow-v2 --config fly.toml --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
