name: Deploy V2 to Fly.io

# Só existe na branch v2 (assim como fly.toml — ver comentário nele).
# Roda em TODO push na v2: cada `git push origin v2` publica automaticamente
# em imobiflow-v2.fly.dev — não há gate manual depois do push (decisão do
# usuário 2026-07-17, pra não depender de workflow_dispatch, que o GitHub só
# permite disparar se o arquivo também existir na branch padrão/main — e a
# v2 não deve tocar a main, mesma regra do fly.toml).
#
# O deploy só começa depois do gate automatizado de TypeScript, código morto e
# build. Um push inválido falha no job validate e não chega ao Fly.io.
#
# Existe porque o flyctl local pode ficar bloqueado por política de
# segurança do Windows (Smart App Control); isso builda e publica 100% nos
# runners do GitHub, sem depender de nada local.
#
# Usa o secret FLY_API_TOKEN_V2 (deploy token escopado só ao app
# imobiflow-v2) — deliberadamente SEPARADO do FLY_API_TOKEN que o
# deploy.yml da v1 usa, pra nunca misturar permissão entre os dois apps.
on:
  push:
    branches: [v2]

jobs:
  validate:
    name: Validate V2
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript
        run: npm run lint

      - name: Automated tests
        run: npm test

      - name: Dead code
        run: npx knip

      - name: Production build
        run: npm run build

  deploy:
    name: Deploy imobiflow-v2
    runs-on: ubuntu-latest
    needs: validate
    concurrency:
      group: deploy-imobiflow-v2
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy
        run: flyctl deploy --app imobiflow-v2 --config fly.toml --remote-only --ha=false
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN_V2 }}

      # O scheduler é obrigatoriamente singleton. A web permanece em uma
      # Machine até o teste de carga e a ativação do Redis distribuído; depois
      # disso pode aumentar sem duplicar jobs recorrentes.
      - name: Keep scheduler singleton
        # web=3: com REDIS_URL configurado (24/07) os rate limiters passam a
        # contar no Redis compartilhado, então múltiplas máquinas param de
        # multiplicar os limites de login/checkout. Três máquinas dão
        # redundância — o Fly drena o tráfego numa antes de derrubar, então o
        # deploy deixa de ter downtime.
        # worker=2: o claim das filas usa lease + fencing token, então rodar
        # vários workers é seguro e dobra a vazão de ingestão (o gargalo).
        # scheduler=1 é obrigatório (singleton — jobs recorrentes).
        run: flyctl scale count web=3 worker=2 scheduler=1 --app imobiflow-v2 --yes
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN_V2 }}
