name: Deploy V2 to Fly.io

# Só existe na branch v2 (assim como fly.toml — ver comentário nele).
# Roda em TODO push na v2: cada `git push origin v2` publica automaticamente
# em imobiflow-v2.fly.dev — não há gate manual depois do push (decisão do
# usuário 2026-07-17, pra não depender de workflow_dispatch, que o GitHub só
# permite disparar se o arquivo também existir na branch padrão/main — e a
# v2 não deve tocar a main, mesma regra do fly.toml).
#
# O deploy só começa depois do gate automatizado de TypeScript, código morto e
# build. Um push inválido falha no job validate e não chega ao Fly.io.
#
# Existe porque o flyctl local pode ficar bloqueado por política de
# segurança do Windows (Smart App Control); isso builda e publica 100% nos
# runners do GitHub, sem depender de nada local.
#
# Usa o secret FLY_API_TOKEN_V2 (deploy token escopado só ao app
# imobiflow-v2) — deliberadamente SEPARADO do FLY_API_TOKEN que o
# deploy.yml da v1 usa, pra nunca misturar permissão entre os dois apps.
on:
  push:
    branches: [v2]

jobs:
  validate:
    name: Validate V2
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript
        run: npm run lint

      - name: Automated tests
        run: npm test
        env:
          # Alguns testes importam módulos do backend apenas para validar
          # contratos/constantes. A chave não é usada em chamadas de rede,
          # mas o bootstrap fail-closed exige um valor não vazio.
          SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-not-a-real-secret

      - name: Dead code
        run: npx knip

      - name: Production build
        run: npm run build

  deploy:
    name: Deploy imobiflow-v2
    runs-on: ubuntu-latest
    needs: validate
    concurrency:
      group: deploy-imobiflow-v2
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy
        run: flyctl deploy --app imobiflow-v2 --config fly.toml --remote-only --ha=false
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN_V2 }}

      # O scheduler é obrigatoriamente singleton. A web permanece em uma
      # Machine até o teste de carga e a ativação do Redis distribuído; depois
      # disso pode aumentar sem duplicar jobs recorrentes.
      - name: Keep scheduler singleton and request target capacity
        # web=3: com REDIS_URL configurado (24/07) os rate limiters passam a
        # contar no Redis compartilhado, então múltiplas máquinas param de
        # multiplicar os limites de login/checkout. Três máquinas dão
        # redundância — o Fly drena o tráfego numa antes de derrubar, então o
        # deploy deixa de ter downtime.
        # worker=2: o claim das filas usa lease + fencing token, então rodar
        # vários workers é seguro e dobra a vazão de ingestão (o gargalo).
        # scheduler=1 é obrigatório (singleton — jobs recorrentes).
        # A reserva de CPUs na região pode falhar mesmo depois de o deploy ter
        # atualizado todas as Machines com saúde. Escala é, portanto, uma
        # tentativa de convergir à capacidade alvo e não pode invalidar uma
        # publicação já concluída. O warning mantém a falta de capacidade
        # visível no run e a tentativa será repetida no próximo deploy.
        run: |
          if ! flyctl scale count web=3 worker=2 scheduler=1 --app imobiflow-v2 --yes; then
            echo "::warning::Deploy concluído, mas a Fly não disponibilizou CPUs suficientes para web=3/worker=2. A capacidade atual foi preservada e a escala será tentada no próximo deploy."
            flyctl status --app imobiflow-v2
          fi
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN_V2 }}

      # `flyctl deploy` ou a escala podem atualizar a Machine singleton do
      # scheduler e deixá-la parada. A contagem correta não garante que ela
      # esteja em execução; sem este start explícito param cobranças, agenda e
      # autocura dos webhooks mesmo com a API saudável.
      - name: Ensure scheduler is running
        run: |
          scheduler_id="$(flyctl machine list --app imobiflow-v2 --json | python3 -c 'import json, sys; machines = json.load(sys.stdin); print(next((m["id"] for m in machines if m.get("config", {}).get("metadata", {}).get("fly_process_group") == "scheduler"), ""))')"
          if [ -z "$scheduler_id" ]; then
            echo "::error::Nenhuma Machine scheduler foi encontrada após o deploy."
            exit 1
          fi
          flyctl machine start "$scheduler_id" --app imobiflow-v2
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN_V2 }}
