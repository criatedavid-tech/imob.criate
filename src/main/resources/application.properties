spring.application.name=imobiflow-ai
server.port=8081

# Supabase (Configuração de API para quando não se tem a senha do DB)
supabase.url=https://umvbrahsqvqeondwtikm.supabase.co
supabase.key=${SUPABASE_SERVICE_ROLE_KEY:your-key}

# Database (H2 como fallback para o app não travar)
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true
spring.jpa.hibernate.ddl-auto=update

# App Config
app.url=${APP_URL:http://localhost:3000}

# Payload Limit
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
server.tomcat.max-swallow-size=10MB
server.tomcat.max-http-form-post-size=10MB
