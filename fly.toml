# ImobiFlow — Fly.io
# Região GRU = São Paulo (menor latência para corretores e webhooks BR).
#
# Primeiro deploy:
#   fly launch --no-deploy        (cria o app; aceite a região gru)
#   fly secrets set SUPABASE_SERVICE_ROLE_KEY=... ASAAS_API_KEY=... (todos os segredos do .env.example)
#   fly deploy
#
# IMPORTANTE: troque "app" abaixo pelo nome real criado no fly launch.
#
# Este fly.toml só existe na branch v2 — app separado ("imobiflow-v2") da
# v1 ("imobiflow", deploy automático via .github/workflows/deploy.yml a
# partir de main). Não faça merge deste arquivo pra main.

app = "imobiflow-v2"
primary_region = "gru"
kill_signal = "SIGTERM"
kill_timeout = 30

[build]
  dockerfile = "Dockerfile"

[build.args]
  # Libera somente a interface; o backend ainda exige todas as travas abaixo.
  VITE_CLIENT_FINANCIAL_OPERATIONS_ENABLED = "true"

[env]
  NODE_ENV = "production"
  PUBLIC_APP_URL = "https://pantus.criate.online"
  CLIENT_FINANCIAL_OPERATIONS_ENABLED = "true"
  CLIENT_FINANCIAL_SANDBOX_ONLY = "true"
  # Demais segredos vão via `fly secrets set` (nunca aqui).

[processes]
  web = "node --import tsx --max-old-space-size=1024 server.ts"
  worker = "node --import tsx --max-old-space-size=1024 webhook-worker.ts"
  scheduler = "node --import tsx --max-old-space-size=384 scheduler-worker.ts"

[http_service]
  processes = ["web"]
  internal_port = 3000
  force_https = true
  # Webhooks do Asaas chegam a qualquer momento → o servidor NUNCA pode
  # dormir/escalar para zero. Mantém sempre 1 máquina viva.
  auto_stop_machines = "off"
  auto_start_machines = true
  # 2+ máquinas sempre vivas: com uma só, todo deploy era downtime (não há
  # para onde drenar o tráfego) e qualquer crash tirava o app do ar.
  min_machines_running = 2

  [http_service.concurrency]
    type = "requests"
    # Com UMA máquina esses números eram decorativos: o soft_limit serve para o
    # proxy ESCOLHER outra máquina, e não havia outra — só o hard_limit valia,
    # como ponto de corte com 503. Agora, com web=3, baixar o soft faz o Fly
    # espalhar antes de sobrecarregar o event loop de uma instância.
    soft_limit = 80
    hard_limit = 150

# Health check: liveness barata do processo Express, sem tocar banco/provedores.
[[http_service.checks]]
  interval = "30s"
  timeout = "5s"
  grace_period = "20s"
  method = "GET"
  path = "/api/health"

[[vm]]
  processes = ["web", "worker"]
  size = "shared-cpu-1x"
  # App ficou enxuto após mover imagens para o Storage (uso real ~150-300MB).
  # 1GB é folgado; suba para "2gb" se for escalar muito verticalmente.
  memory = "1gb"

[[vm]]
  processes = ["scheduler"]
  size = "shared-cpu-1x"
  memory = "512mb"
